[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-gameboy-extractor"
version = "1.0.0"
description = "Project-neutral Pokemon Red/Blue data and asset extraction pipeline"
requires-python = ">=3.10"
dependencies = ["Pillow==12.3.0"]
license = "MIT"
keywords = ["game-boy", "pokemon", "data-extraction", "rom-hacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/brynnb/pokemon-gameboy-extractor-tool"
Repository = "https://github.com/brynnb/pokemon-gameboy-extractor-tool"
Issues = "https://github.com/brynnb/pokemon-gameboy-extractor-tool/issues"

[project.scripts]
pokemon-gameboy-extract = "pokemon_gameboy_extractor.cli:extract"
pokemon-gameboy-render-audio = "pokemon_gameboy_extractor.cli:render_audio"
pokemon-gameboy-catalogue-graphics = "pokemon_gameboy_extractor.cli:catalogue_graphics"

[tool.setuptools]
package-dir = {"" = "export_scripts"}
packages = ["adapters", "pokemon_gameboy_extractor"]
py-modules = [
    "build_audio_rom",
    "config",
    "create_zones_and_tiles",
    "export_audio_manifest",
    "export_graphics",
    "export_hidden_objects",
    "export_items",
    "export_learnsets",
    "export_map",
    "export_map_scripts",
    "export_moves",
    "export_objects",
    "export_pokemon",
    "export_release_metadata",
    "export_script_candidates",
    "export_text",
    "export_trainers",
    "export_viewer_data",
    "export_warps",
    "export_wild_encounters",
    "map_references",
    "pokemon_names",
    "render_audio_assets",
    "reprocess",
    "runtime_profiles",
    "text_tokens",
    "tile_helpers",
    "update_object_coordinates",
    "update_zone_coordinates",
]
