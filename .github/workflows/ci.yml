name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q export_scripts
      - name: Run extractor tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s export_scripts -p 'test_*.py'
      - name: Install pinned RGBDS for integration extraction
        if: matrix.python-version == '3.14'
        env:
          RGBDS_SHA256: 280a52061a0c516999bee75ac357628d6d50784309e0486cef25f7460e6f330b
          RGBDS_URL: https://github.com/gbdev/rgbds/releases/download/v1.0.3/rgbds-linux-x86_64.tar.xz
        run: |
          mkdir -p "${RUNNER_TEMP}/rgbds"
          curl --fail --location --silent --show-error \
            "${RGBDS_URL}" --output "${RUNNER_TEMP}/rgbds.tar.xz"
          echo "${RGBDS_SHA256}  ${RUNNER_TEMP}/rgbds.tar.xz" | sha256sum --check
          tar -xJf "${RUNNER_TEMP}/rgbds.tar.xz" -C "${RUNNER_TEMP}/rgbds"
          echo "${RUNNER_TEMP}/rgbds" >> "${GITHUB_PATH}"
      - name: Run complete metadata and graphics extraction
        if: matrix.python-version == '3.14'
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          python export_scripts/reprocess.py
          release_outputs=(
            pokemon.db audio_manifest.json script_event_candidates.json
            script_event_ir.json script_event_diagnostics.json
            script_event_in_game_trades.json script_event_tile_overrides.json
            script_event_boulder_targets.json script_event_object_visibility.json
            script_event_conditional_dialogue.json build/graphics
            export_scripts/tile_images pokemon-phaser/public/viewer-data
            pokemon-phaser/public/viewer-assets
          )
          find "${release_outputs[@]}" -type f -print0 \
            | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/release-first.sha256"
          python export_scripts/reprocess.py
          find "${release_outputs[@]}" -type f -print0 \
            | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/release-second.sha256"
          cmp "${RUNNER_TEMP}/release-first.sha256" "${RUNNER_TEMP}/release-second.sha256"
          git diff --exit-code -- \
            audio_manifest.json script_event_boulder_targets.json \
            script_event_object_visibility.json script_event_tile_overrides.json
      - name: Validate CaptureQuest schema-v2 adapter against fresh output
        if: matrix.python-version == '3.14'
        env:
          POKEMON_EXTRACTOR_INTEGRATION_DB: ${{ github.workspace }}/pokemon.db
          PYTHONPATH: export_scripts
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest adapters.test_capturequest_v2
          python -m adapters.capturequest_v2 pokemon.db --release red \
            --output "${RUNNER_TEMP}/capturequest-red.json"
          python -m adapters.capturequest_v2 pokemon.db --release blue \
            --output "${RUNNER_TEMP}/capturequest-blue.json"
          test -s "${RUNNER_TEMP}/capturequest-red.json"
          test -s "${RUNNER_TEMP}/capturequest-blue.json"
      - name: Build installable distribution
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/wheelhouse" .
      - name: Install and smoke-test distribution entry points
        run: |
          python -m venv "${RUNNER_TEMP}/installed"
          "${RUNNER_TEMP}/installed/bin/python" -m pip install \
            --disable-pip-version-check "${RUNNER_TEMP}"/wheelhouse/*.whl
          for command in \
            pokemon-gameboy-extract \
            pokemon-gameboy-render-audio \
            pokemon-gameboy-catalogue-graphics \
            pokemon-gameboy-adapt-capturequest
          do
            "${RUNNER_TEMP}/installed/bin/${command}" --help >/dev/null
          done
          if "${RUNNER_TEMP}/installed/bin/pokemon-gameboy-render-audio" \
              --gbs "${RUNNER_TEMP}/missing.gbs" >/dev/null 2>&1; then
            echo "audio renderer masked a failure" >&2
            exit 1
          fi

  viewer:
    name: Viewer build and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: pokemon-phaser/package-lock.json
      - name: Install locked viewer dependencies
        run: npm --prefix pokemon-phaser ci --ignore-scripts
      - name: Type-check viewer
        run: npm run viewer:typecheck
      - name: Build viewer
        run: npm run viewer:build
      - name: Audit viewer dependencies
        run: npm run audit:viewer
